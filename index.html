<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="product">LoCRANE · Aging Clock — BioAI Lab</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta name="description" content="See how old your blood looks. Drop in two small files or use the example, and get the LoCRANE aging-clock reading in about a second. BioAI Lab.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="site-head">
    <a class="brand" href="#top">
      <span class="logo-card"><img src="assets/logo-256.png" alt="BioAI Lab" width="44" height="44"></span>
      <span class="brand-txt">
        <strong data-i18n="brand">BioAI Lab</strong>
        <small data-i18n="product">LoCRANE · Aging Clock</small>
      </span>
    </a>
    <div class="head-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="zh-Hans">中文</button>
        <button type="button" class="lang-btn" data-lang="zh-Hant">繁體</button>
      </div>
      <button type="button" id="menuBtn" class="menu-btn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <aside id="drawer" aria-label="Menu">
    <div class="drawer-head">
      <strong data-i18n="brand">BioAI Lab</strong>
      <button type="button" id="drawerClose" class="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="lang lang-drawer" role="group" aria-label="Language">
      <button type="button" class="lang-btn is-active" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="zh-Hans">中文</button>
      <button type="button" class="lang-btn" data-lang="zh-Hant">繁體</button>
    </div>
    <nav class="drawer-nav">
      <a href="#results" data-i18n="navResults"></a>
      <a href="#how" data-i18n="navHow"></a>
      <a href="https://github.com/SHENTongfei/LoCRANE" target="_blank" rel="noopener" data-i18n="navRepo"></a>
    </nav>
  </aside>
  <div id="overlay" hidden></div>

  <main class="wrap" id="top">
    <section class="hero">
      <h1 data-i18n="h1"></h1>
      <p class="hero-sub" data-i18n="h1sub"></p>
      <div class="hero-chips">
        <span class="hchip"><i class="dot dot-a"></i><span data-i18n="get1"></span></span>
        <span class="hchip"><i class="dot dot-b"></i><span data-i18n="get2"></span></span>
        <span class="hchip"><i class="dot dot-c"></i><span data-i18n="get3"></span></span>
      </div>
      <p class="cert" data-i18n="certLine"></p>
    </section>

    <section class="drop-card glass" id="drop" aria-label="Drop data">
      <div class="drop-inner">
        <div class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 6v24M15 21l9 9 9-9"/>
            <path d="M8 38h32v4H8z"/>
          </svg>
        </div>
        <div class="drop-txt">
          <div class="drop-title" data-i18n="dropTitle"></div>
          <div class="drop-sub" data-i18n="dropSub"></div>
          <div class="drop-btns">
            <button type="button" class="btn btn-primary" id="btnDemo"><span data-i18n="btnDemo"></span></button>
            <a class="btn btn-ghost" id="btnDownload" href="#"><span data-i18n="btnDownload"></span></a>
          </div>
        </div>
      </div>
      <div class="drop-chips">
        <span class="chip"><i class="dot dot-a"></i><span data-i18n="dropHintExpr"></span></span>
        <span class="chip"><i class="dot dot-b"></i><span data-i18n="dropHintPhen"></span></span>
      </div>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt" multiple hidden>
    </section>

    <div class="status" id="status" hidden>
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText" data-i18n="computing"></span>
    </div>

    <section class="results" id="results" hidden>
      <div class="results-head">
        <h2 data-i18n="resultsTitle"></h2>
        <p data-i18n="resultsSub"></p>
      </div>

      <div class="kpis">
        <div class="kpi glass"><small data-i18n="kpiMae"></small><strong id="kpiMae">–</strong><span data-i18n="kpiMaeSub"></span></div>
        <div class="kpi glass"><small data-i18n="kpiR2"></small><strong id="kpiR2">–</strong><span data-i18n="kpiR2Sub"></span></div>
        <div class="kpi glass"><small data-i18n="kpiSamples"></small><strong id="kpiSamples">–</strong></div>
        <div class="kpi glass kpi-l90"><small data-i18n="kpiL90"></small><strong id="kpiL90">–</strong><span data-i18n="kpiL90Sub"></span></div>
      </div>
      <p class="small-line" id="smallLine"></p>

      <div class="grid">
        <figure class="card glass chart chart-wide">
          <figcaption data-i18n="scatterTitle"></figcaption>
          <div class="chart-box" id="chartScatter" role="img"></div>
        </figure>

        <figure class="card glass">
          <figcaption data-i18n="viewsTitle"></figcaption>
          <div class="chart-box" id="chartViews" role="img"></div>
        </figure>

        <figure class="card glass">
          <figcaption data-i18n="bandTitle"></figcaption>
          <div class="chart-box" id="chartBands" role="img"></div>
        </figure>

        <figure class="card glass chart-wide">
          <div class="lever-head">
            <figcaption data-i18n="leversTitle"></figcaption>
            <small data-i18n="leversSub"></small>
          </div>
          <div class="chart-box chart-tall" id="chartLevers" role="img"></div>
        </figure>

        <aside class="card glass gate-card">
          <h3 data-i18n="gateTitle"></h3>
          <div class="gate-big">
            <strong id="gateBig">–</strong>
            <small id="gateScore"></small>
          </div>
          <p class="gate-note" id="gateNote"></p>
          <p class="gate-meta" id="gateMeta"></p>
        </aside>
      </div>

      <details class="samples glass">
        <summary data-i18n="sampleTable"></summary>
        <div class="tbl-wrap">
          <table id="sampleTable">
            <thead><tr>
              <th data-i18n="colSample"></th><th data-i18n="colChron"></th>
              <th data-i18n="colPred"></th><th data-i18n="colResid"></th><th data-i18n="colBand"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <section class="how" id="how">
      <h2 class="sec-title" data-i18n="howIntro"></h2>
      <div class="how-grid">
        <article class="card glass how-card">
          <h3 data-i18n="bioTitle"></h3>
          <p data-i18n="bioText"></p>
          <div class="fig fig-bands">
            <svg viewBox="0 0 640 210" class="svg-fig" aria-hidden="true">
              <defs>
                <linearGradient id="gY" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#9cc7de"/><stop offset="1" stop-color="#c2e0ee"/>
                </linearGradient>
                <linearGradient id="gM" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#776b97"/><stop offset="1" stop-color="#b9aed1"/>
                </linearGradient>
                <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#c68dc0"/><stop offset="1" stop-color="#e7b8dd"/>
                </linearGradient>
              </defs>
              <rect x="40"  y="70" width="150" height="46" rx="23" fill="url(#gY)" opacity="0.9"/>
              <rect x="210" y="70" width="250" height="46" rx="23" fill="url(#gM)" opacity="0.9"/>
              <rect x="480" y="70" width="120" height="46" rx="23" fill="url(#gL)" opacity="0.95"/>
              <text class="seg-lab" x="115" y="98"  data-i18n="bandY"></text>
              <text class="seg-lab" x="335" y="98"  data-i18n="bandM"></text>
              <text class="seg-lab seg-lab-l" x="540" y="98" data-i18n="bandL"></text>
              <path d="M480 60 v-14 m0 0 l-6 8 m6 -8 l6 8" stroke="#e7b8dd" stroke-width="2" fill="none"/>
              <text class="anno" id="svgAnno" x="540" y="34" text-anchor="middle"></text>
              <text class="tick" x="40" y="140">50</text>
              <text class="tick" x="460" y="140">89</text>
              <text class="tick" x="598" y="140">90+</text>
              <line x1="40" y1="132" x2="600" y2="132" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
              <text class="anno anno-soft" x="320" y="176" text-anchor="middle" data-i18n="svgAnno"></text>
            </svg>
          </div>
        </article>

        <article class="card glass how-card">
          <h3 data-i18n="methodTitle"></h3>
          <p data-i18n="methodText"></p>
          <div class="ing">
            <span data-i18n="ing1"></span><span data-i18n="ing2"></span>
            <span data-i18n="ing3"></span><span data-i18n="ing4"></span>
          </div>
          <div class="fig fig-model">
            <svg viewBox="0 0 640 300" class="svg-fig" aria-hidden="true">
              <defs>
                <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#1b2440"/><stop offset="1" stop-color="#141a30"/>
                </linearGradient>
                <linearGradient id="gc" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#c68dc0"/><stop offset="1" stop-color="#776b97"/>
                </linearGradient>
                <linearGradient id="ar" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="rgba(198,141,192,.15)"/><stop offset="1" stop-color="#c68dc0"/>
                </linearGradient>
                <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                  <path d="M0,0 L7,3 L0,6 Z" fill="#c68dc0"/>
                </marker>
              </defs>
              <rect x="28"  y="112" width="128" height="76" rx="16" fill="url(#gb)" stroke="rgba(255,255,255,.14)"/>
              <text class="box-lab" x="92" y="147" text-anchor="middle" data-i18n="svgFiles"></text>
              <text class="box-sub" x="92" y="168" text-anchor="middle">CSV + CSV</text>

              <line x1="156" y1="150" x2="196" y2="150" stroke="url(#ar)" stroke-width="2.5" marker-end="url(#ah)"/>

              <rect x="200" y="118" width="120" height="64" rx="14" fill="url(#gb)" stroke="rgba(255,255,255,.14)"/>
              <text class="box-lab" x="260" y="146" text-anchor="middle" data-i18n="svgClean"></text>
              <text class="box-sub" x="260" y="166" text-anchor="middle">z-score</text>

              <line x1="320" y1="150" x2="352" y2="92"  stroke="url(#ar)" stroke-width="2" marker-end="url(#ah)"/>
              <line x1="320" y1="150" x2="352" y2="150" stroke="url(#ar)" stroke-width="2" marker-end="url(#ah)"/>
              <line x1="320" y1="150" x2="352" y2="208" stroke="url(#ar)" stroke-width="2" marker-end="url(#ah)"/>

              <g>
                <rect x="356" y="66"  width="110" height="50" rx="13" fill="url(#gb)" stroke="#9cc7de" stroke-opacity=".5"/>
                <text class="box-lab" x="411" y="88" text-anchor="middle" data-i18n="svgAll"></text>
                <text class="box-sub" x="411" y="106" text-anchor="middle">MAE 12.5</text>
                <rect x="356" y="124" width="110" height="50" rx="13" fill="url(#gb)" stroke="#b9aed1" stroke-opacity=".5"/>
                <text class="box-lab" x="411" y="146" text-anchor="middle" data-i18n="svg40"></text>
                <text class="box-sub" x="411" y="164" text-anchor="middle">MAE 10.9</text>
                <rect x="356" y="182" width="110" height="50" rx="13" fill="url(#gb)" stroke="#e7b8dd" stroke-opacity=".5"/>
                <text class="box-lab" x="411" y="204" text-anchor="middle" data-i18n="svg150"></text>
                <text class="box-sub" x="411" y="222" text-anchor="middle">MAE 11.4</text>
              </g>

              <line x1="466" y1="91"  x2="498" y2="136" stroke="url(#ar)" stroke-width="2" marker-end="url(#ah)"/>
              <line x1="466" y1="149" x2="498" y2="149" stroke="url(#ar)" stroke-width="2" marker-end="url(#ah)"/>
              <line x1="466" y1="207" x2="498" y2="162" stroke="url(#ar)" stroke-width="2" marker-end="url(#ah)"/>

              <rect x="502" y="111" width="110" height="76" rx="16" fill="url(#gb)" stroke="rgba(255,255,255,.18)"/>
              <text class="box-lab" x="557" y="146" text-anchor="middle" data-i18n="svgBlend"></text>
              <text class="box-sub" x="557" y="167" text-anchor="middle">1/3 + 1/3 + 1/3</text>

              <line x1="557" y1="187" x2="557" y2="236" stroke="url(#ar)" stroke-width="2.5" marker-end="url(#ah)"/>
              <rect x="487" y="240" width="140" height="44" rx="22" fill="url(#gc)"/>
              <text class="box-lab box-lab-out" x="557" y="267" text-anchor="middle" data-i18n="svgReading"></text>
            </svg>
          </div>
          <div class="codecard">
            <small data-i18n="codeSnippetLabel"></small>
            <pre><code><span class="c-com">// three views of the same idea, at three detail levels</span>
<span class="c-kw">const</span> views = [<span class="c-fn">ridge</span>(allGenes), <span class="c-fn">ridge</span>(top40), <span class="c-fn">ridge</span>(top150)];
<span class="c-kw">const</span> reading = (views[0] + views[1] + views[2]) / 3;  <span class="c-com">// all of it, on your device</span></code></pre>
          </div>
        </article>

        <article class="card glass how-card how-wide">
          <h3 data-i18n="codeTitle"></h3>
          <p data-i18n="codeText"></p>
          <a class="repo-link" href="https://github.com/SHENTongfei/LoCRANE" target="_blank" rel="noopener">
            <span data-i18n="fullCode"></span> ↗
          </a>
        </article>
      </div>
    </section>

    <footer class="foot">
      <p data-i18n="disclaimer"></p>
      <div class="foot-links">
        <span data-i18n="footerPaper"></span>
        <a href="https://github.com/SHENTongfei/LoCRANE" target="_blank" rel="noopener" data-i18n="footerRepo"></a>
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
